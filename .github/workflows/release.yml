name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version label used for a dry run
        required: true
        default: dev

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true
      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then version="${{ inputs.version }}"; fi
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            name="backline-${version}-${goos}-${goarch}"
            extension=""
            if [[ "$goos" == "windows" ]]; then extension=".exe"; fi
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "dist/backline${extension}" ./cmd/backline
            if [[ "$goos" == "windows" ]]; then
              (cd dist && zip -q "${name}.zip" "backline${extension}")
            else
              tar -C dist -czf "dist/${name}.tar.gz" backline
            fi
            rm "dist/backline${extension}"
          done
          (cd dist && sha256sum backline-* > SHA256SUMS)
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Upload dry-run artifacts
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: backline-release-dry-run
          path: dist/**
      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
