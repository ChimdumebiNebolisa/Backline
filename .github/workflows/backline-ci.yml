name: backline-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: unit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true
      - name: Format check
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l cmd internal examples/rollout-demo/harness examples/rollout-demo/fixture/workload.go)"
      - name: Unit and non-Docker integration tests
        run: go test ./...
      - name: Vet
        run: go vet ./...

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true
      - run: go test -race ./...

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true
      - name: Dependency vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm audit
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run browser:test
      - run: npm run lighthouse

  docker-e2e:
    needs: [unit, race, security, site]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true
      - name: Public rollout demos
        run: bash ./examples/rollout-demo/run.sh
        env:
          BACKLINE_DEMO_ARTIFACT_ROOT: ${{ github.workspace }}/build/demo-artifacts
      - name: Prepared rollback and lifecycle fixtures
        run: |
          bash ./examples/rollout-demo/run.sh prepared-rollback
          bash ./examples/rollout-demo/run.sh handoff
          bash ./examples/rollout-demo/run.sh candidate-only-failure
        env:
          BACKLINE_DEMO_ARTIFACT_ROOT: ${{ github.workspace }}/build/demo-artifacts
      - name: Upload run artifacts and JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rollout-demo-artifacts
          path: build/demo-artifacts/**
          if-no-files-found: error
