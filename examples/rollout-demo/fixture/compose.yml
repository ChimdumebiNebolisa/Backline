services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: backline
      POSTGRES_USER: backline
      POSTGRES_PASSWORD: backline-demo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backline -d backline"]
      interval: 1s
      timeout: 2s
      retries: 30
    volumes:
      - data:/var/lib/postgresql/data

volumes:
  data: {}
